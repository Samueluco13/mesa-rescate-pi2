name: PHP syntax and package
on:
  push:
    branches: [main, develop, 'feature/**', 'test/**', 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Validate PHP sources present on this branch
        run: |
          for dir in plugin theme tests; do
            if [ -d "$dir" ]; then
              find "$dir" -name '*.php' -print0 | xargs -0 -r -n1 php -l
            fi
          done
      - name: Validate app JavaScript
        run: |
          for file in plugin/rescate-alimentos/assets/*.js; do
            node --check "$file"
          done
      - name: Validate map behavior
        run: node tests/maps-ui.mjs
      - name: Validate Spanish field messages and safe retries
        run: node --test tests/forms-es.mjs
      - name: Validate available delivery packages
        run: |
          if [ -f tests/package_check.py ]; then
            python3 tests/package_check.py
          fi
